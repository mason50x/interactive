<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Experience</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: #fff; font: 14px/1.5 system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { html, body { background: #111; color: #eee; } }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .notice { box-sizing: border-box; max-width: 32rem; margin: 0 auto; padding: 3rem 1.5rem; }
  .notice p { margin: 0 0 0.75rem; }
  code { font-size: 0.9em; }
  .startup-error { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; border: 1px solid #888; border-radius: 0.5rem; font-size: 0.85rem; }
</style>
</head>
<body>
<!--
  The experience frontend, in one page.

  The app frames this page with the destination in `?u=`. It registers the
  experience engine's service worker over /service/, points the transport at the Bare
  server on this same origin (/v3/), and frames the rewritten page. There is no
  address bar and no navigation UI on purpose: the app decides what is opened,
  and the Worker decides what is fetched. Editing this page cannot widen the
  allowlist, because the allowlist is enforced server-side in src/worker.js.
-->
<script src="/bridge/index.js"></script>
<script src="/experience/bundle.js"></script>
<script src="/experience/config.js"></script>
<script>
  (async () => {
    const target = new URLSearchParams(location.search).get("u");
    const show = (html) => { document.body.innerHTML = `<div class="notice">${html}</div>`; };

    if (!target) {
      show("<p>Nothing to open.</p><p>This page expects a destination in <code>?u=</code>.</p>");
      return;
    }
    if (!("serviceWorker" in navigator)) {
      show("<p>This browser cannot run the experience.</p><p>It needs service workers, which are off in private windows in some browsers.</p>");
      return;
    }

    let stage = "Connecting to the browser transport";
    try {
      // Existing workers may still have requests waiting for a live transport.
      // Give them a port before waiting for their replacement to activate;
      // otherwise those requests can prevent activation indefinitely.
      const connection = new BareMux.BareMuxConnection("/bridge/worker.js");
      stage = "Loading the browser transport";
      await connection.setTransport("/transport.mjs", [location.origin + "/"]);

      // Wait for a usable worker in *this* registration. `serviceWorker.ready` would
      // never resolve here: it waits for a worker whose scope covers this page,
      // and ours covers /service/ only.
      stage = "Registering the service worker";
      const registration = await navigator.serviceWorker.register("/sw.js", {
        scope: experienceConfig.prefix,
        updateViaCache: "none",
      });
      stage = "Activating the service worker";
      await new Promise((resolve, reject) => {
        // A pending event in the previous worker can hold an update in waiting
        // even after skipWaiting(). Keep using the activated worker in that
        // case; requiring the update would fail every launch until it drains.
        const worker = registration.active?.state === "activated"
          ? registration.active
          : registration.installing || registration.waiting || registration.active;
        if (!worker) return reject(new Error("The experience worker was not installed."));
        if (worker.state === "activated") return resolve();
        const timeout = setTimeout(() => {
          worker.removeEventListener("statechange", check);
          reject(new Error("The experience took too long to start. Please reload."));
        }, 15000);
        function check() {
          if (worker.state !== "activated" && worker.state !== "redundant") return;
          clearTimeout(timeout);
          worker.removeEventListener("statechange", check);
          if (worker.state === "activated") resolve();
          else reject(new Error("The experience worker could not start."));
        }
        worker.addEventListener("statechange", check);
        check();
      });

      stage = "Opening the destination";
      const frame = document.createElement("iframe");
      frame.title = "Experience";
      frame.allow = "fullscreen; autoplay; encrypted-media";
      frame.src = experienceConfig.prefix + experienceConfig.encodeUrl(target);
      document.body.replaceChildren(frame);
    } catch (error) {
      console.error("Experience startup failed", error);
      show("<p>The experience could not start.</p><p>Please share the error below so we can troubleshoot it.</p><pre class=\"startup-error\" role=\"alert\"></pre><button type=\"button\">Try again</button>");
      // Browser errors can contain URLs or markup. Display them as text only.
      const detail = error == null ? "Unknown error" :
        typeof error === "object" && error.message ?
          `${error.name || "Error"}: ${error.message}` : String(error);
      document.querySelector(".startup-error").textContent = `Step: ${stage}\n${detail}`;
      document.querySelector("button").addEventListener("click", () => location.reload());
    }
  })();
</script>
</body>
</html>
