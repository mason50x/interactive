<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Claude requires a direct connection</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; padding: 48px 24px; }
    main { max-width: 30rem; margin: auto; }
    h1 { font-size: 24px; }
    a, button { display: inline-block; font: inherit; padding: 10px 18px; border-radius: 8px; }
    a { background: #80523e; color: white; text-decoration: none; margin-right: 8px; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Open Claude directly</h1>
    <p>Claude requires a browser verification that can’t finish inside Experience.</p>
    <p>You can open Claude in a new tab to continue.</p>
    <a href="https://claude.ai/" target="_blank" rel="noopener noreferrer">Open Claude</a>
    <button type="button" onclick="location.reload()">Try again here</button>
  </main>
</body>
</html>
