name: Feature request
description: Suggest a focused improvement.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who needs this and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
