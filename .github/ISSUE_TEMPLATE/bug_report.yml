name: Bug report
description: Report a reproducible problem with the application.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: "Do not post secrets or personal data. Report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the affected route and a minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit and environment
      placeholder: "Commit SHA, browser/OS, local or hosted"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove tokens, cookies, emails, and other personal information.
